# Copy this file to .github/workflows/ in your GitHub repo.
# Builds the Windows app on every push / tag. Download it from the run's "Artifacts".
# Tag a release (e.g. v4.1.0) to also attach the zip and installer to a GitHub Release.
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller send2trash windnd
          choco install innosetup -y --no-progress
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python scripts/build_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotographyTools-windows
          path: |
            dist/*.zip
            dist/*Setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*Setup.exe
